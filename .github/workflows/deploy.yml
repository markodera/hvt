name: Deploy to Production SSH

# ==============================================================================
# HVT Continuous Deployment Workflow
# ==============================================================================
# This workflow automatically deploys the latest code to the Linux server via SSH
# whenever a commit is pushed or merged to the 'main' branch.
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   - VPS_HOST    (or DO_HOST)    : 84.12.124.67
#   - VPS_USER    (or DO_USER)    : ubuntu
#   - VPS_SSH_KEY (or DO_SSH_KEY) : Private SSH Key
# ==============================================================================

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.DO_HOST }}
          username: ${{ secrets.VPS_USER || secrets.DO_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.DO_SSH_KEY }}
          script: |
            set -e
            # 1. Navigate to the project directory
            cd /home/ubuntu/hvt
            
            # 2. Pull the latest code from the main branch
            git pull origin main
            
            # 3. Activate the virtual environment
            source venv/bin/activate
            
            # 4. Install any new dependencies
            pip install -r requirements.txt
            
            # 5. Apply any pending database migrations
            python manage.py migrate --noinput
            
            # 6. Collect new static files for Nginx to serve
            python manage.py collectstatic --noinput
            
            # 7. Restart HVT service via systemd
            sudo systemctl restart hvt
            
            # 8. Verify service is active
            sudo systemctl is-active --quiet hvt && echo "HVT deployment successfully reloaded!" || exit 1
