name: Deploy to Production SSH

# ==============================================================================
# HVT Continuous Deployment Workflow
# ==============================================================================
# This workflow automatically deploys the latest code to the Linux server via SSH
# whenever a commit is pushed or merged to the 'main' branch.
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   - VPS_HOST    (or DO_HOST)    : 84.12.124.67
#   - VPS_USER    (or DO_USER)    : ubuntu
#   - VPS_SSH_KEY (or DO_SSH_KEY) : Private SSH Key
# ==============================================================================

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.DO_HOST }}
          username: ${{ secrets.VPS_USER || secrets.DO_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.DO_SSH_KEY }}
          script: |
            set -e
            # 1. Navigate to the project directory
            cd /home/ubuntu/hvt
            
            # 2. Pull the latest code from the main branch
            git pull origin main
            
            # 3. Activate the virtual environment
            source venv/bin/activate
            
            # 4. Install any new dependencies
            pip install -r requirements.txt
            
            # 4b. Ensure production secrets exist in .env if not already set
            if [ -f .env ]; then
              if ! grep -q "HVT_JWT_PRIVATE_KEY=" .env; then
                echo "Generating production HVT_JWT_PRIVATE_KEY in .env..."
                KEY=$(python -c "from cryptography.hazmat.primitives.asymmetric import rsa; from cryptography.hazmat.primitives import serialization; priv = rsa.generate_private_key(65537, 2048); print(priv.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()).decode().replace('\n', '\\\n'))")
                printf '\nHVT_JWT_PRIVATE_KEY="%s"\n' "$KEY" >> .env
              fi
              if ! grep -q "HVT_ENCRYPTION_KEYS=" .env; then
                echo "Generating production HVT_ENCRYPTION_KEYS in .env..."
                ENC_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
                printf '\nHVT_ENCRYPTION_KEYS="%s"\n' "$ENC_KEY" >> .env
              fi
            fi
            
            # 5. Apply any pending database migrations
            python manage.py migrate --noinput
            
            # 6. Collect new static files for Nginx to serve
            python manage.py collectstatic --noinput
            
            # 7. Restart HVT web service and outbox worker via systemd
            sudo systemctl restart hvt
            if systemctl is-active --quiet hvt-worker 2>/dev/null; then
              sudo systemctl restart hvt-worker
            fi
            
            # 8. Verify service is active
            sudo systemctl is-active --quiet hvt && echo "HVT deployment successfully reloaded!" || exit 1
