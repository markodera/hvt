name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hvt
          POSTGRES_USER: hvt
          POSTGRES_PASSWORD: hvt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hvt -d hvt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "1"
      SECRET_KEY: ci-secret-key-at-least-fifty-characters-long-and-random-12345
      HVT_ENCRYPTION_KEYS: "TWSlhosVb6FmvGMQNRARDCDoZuZ1xWHO2zjeLNoDb8A="
      FRONTEND_URL: http://localhost:5173
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DB_NAME: hvt
      DB_USER: hvt
      DB_PASSWORD: hvt
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      USE_REDIS_CACHE: "0"
      EXPOSE_ADMIN: "1"
      EXPOSE_API_DOCS: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency vulnerability audit (pip-audit)
        run: python scripts/audit_dependencies.py

      - name: Django system checks
        run: python manage.py check

      - name: Django migration check
        run: python manage.py makemigrations --check

      - name: Run Backend Test Suite
        run: python manage.py test

  cli:
    name: CLI Tests (@hvt/cli)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CLI dependencies
        run: |
          cd cli
          npm ci

      - name: Build CLI
        run: |
          cd cli
          npm run build

      - name: Run CLI Test Suite
        run: |
          cd cli
          npm test
